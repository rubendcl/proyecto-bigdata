<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="510" viewBox="0 0 1200 510" role="img" aria-labelledby="title desc">
  <title id="title">Proceso ETL Bronze Silver Gold</title>
  <desc id="desc">Lote sintético, escritura Bronze, validación Silver con registros rechazados y agregación Gold.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#52708d"/></marker><style>text{font-family:Arial,sans-serif;fill:#203247}.title{font-size:28px;font-weight:700}.sub{font-size:16px;fill:#61768a}.head{font-size:20px;font-weight:700}.body{font-size:15px}.note{font-size:13px;fill:#586d81}.box{stroke-width:2;rx:15}.arr{stroke:#52708d;stroke-width:3;fill:none;marker-end:url(#arrow)}</style></defs>
  <rect width="1200" height="510" fill="#fff"/><text x="50" y="52" class="title">Flujo ETL local: Bronze → Silver → Gold</text><text x="50" y="80" class="sub">Implementación observada con Python y archivos JSON; la ruta probada no usa Spark ni Delta Lake</text>
  <rect x="45" y="150" width="220" height="160" class="box" fill="#edf4ff" stroke="#4675aa"/><text x="155" y="190" text-anchor="middle" class="head">Entrada</text><text x="155" y="225" text-anchor="middle" class="body">Transacciones sintéticas</text><text x="155" y="252" text-anchor="middle" class="body">lote de tamaño N</text><text x="155" y="280" text-anchor="middle" class="note">generador Python</text>
  <rect x="335" y="150" width="220" height="160" class="box" fill="#fff3df" stroke="#d48a24"/><text x="445" y="190" text-anchor="middle" class="head">Bronze</text><text x="445" y="225" text-anchor="middle" class="body">Datos de origen</text><text x="445" y="252" text-anchor="middle" class="body">JSON sin limpiar</text><text x="445" y="280" text-anchor="middle" class="note">datos/lakehouse/raw</text>
  <rect x="625" y="150" width="240" height="160" class="box" fill="#eaf6f3" stroke="#32947e"/><text x="745" y="190" text-anchor="middle" class="head">Silver</text><text x="745" y="225" text-anchor="middle" class="body">Validación y normalización</text><text x="745" y="252" text-anchor="middle" class="body">aceptados / rechazados</text><text x="745" y="280" text-anchor="middle" class="note">datos/lakehouse/silver</text>
  <rect x="935" y="150" width="220" height="160" class="box" fill="#f1ebfa" stroke="#815bb0"/><text x="1045" y="190" text-anchor="middle" class="head">Gold</text><text x="1045" y="225" text-anchor="middle" class="body">KPIs y agregaciones</text><text x="1045" y="252" text-anchor="middle" class="body">región, tipo, riesgo</text><text x="1045" y="280" text-anchor="middle" class="note">datos/lakehouse/gold</text>
  <path d="M265 230 H325" class="arr"/><path d="M555 230 H615" class="arr"/><path d="M865 230 H925" class="arr"/>
  <rect x="625" y="365" width="240" height="75" rx="12" fill="#fff0f0" stroke="#c65b5b" stroke-width="2"/><text x="745" y="395" text-anchor="middle" class="body" font-weight="700">Registros rechazados</text><text x="745" y="420" text-anchor="middle" class="note">incompletos o con monto inválido</text><path d="M745 310 V355" class="arr"/>
  <text x="45" y="480" class="note">Las cantidades de entrada, aceptación y rechazo dependen de la corrida; las capas se almacenan localmente en JSON.</text>
</svg>
